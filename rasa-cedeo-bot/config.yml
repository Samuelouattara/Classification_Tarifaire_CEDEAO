language: fr

pipeline:
  # Pipeline spécialisé pour classification douanière
  - name: WhitespaceTokenizer
  - name: RegexFeaturizer
  - name: LexicalSyntacticFeaturizer
  - name: CountVectorsFeaturizer
  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 1
    max_ngram: 4
  - name: DIETClassifier
    epochs: 100
    learning_rate: 0.001
    # Configuration spécialisée pour entités douanières
    entity_recognition:
      enabled: true
      learning_rate: 0.001
    intent_classification:
      enabled: true
      learning_rate: 0.001
  - name: EntitySynonymMapper
  - name: ResponseSelector
    epochs: 100
    learning_rate: 0.001

policies:
  # Politiques spécialisées pour validation douanière
  - name: MemoizationPolicy
    max_history: 5
  - name: RulePolicy
    core_fallback_threshold: 0.3
    core_fallback_action_name: "action_default_fallback"
    enable_fallback_prediction: true
  - name: UnexpecTEDIntentPolicy
    max_history: 5
    epochs: 100
  - name: TEDPolicy
    max_history: 5
    epochs: 100
    learning_rate: 0.001
    # Configuration pour classification précise
    constrain_similarities: true
    model_confidence: linear_norm
