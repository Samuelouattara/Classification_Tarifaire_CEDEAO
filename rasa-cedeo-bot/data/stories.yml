version: "3.1"

stories:
# Story: Classification simple d'un produit
- story: classification simple
  steps:
  - intent: classify_product
    entities:
    - product_type: "avion"
  - action: action_classify_product
  - slot_was_set:
    - tariff_code: "8802.20.00.00"
    - section_number: "XVII"
    - chapter_number: "88"
    - classification_confidence: 99.9
    - validation_status: "validated"

# Story: Classification avec validation humaine requise
- story: classification complexe
  steps:
  - intent: classify_product
    entities:
    - product_description: "avion en plastique pour enfants"
  - action: action_classify_product
  - slot_was_set:
    - tariff_code: "9503.00.00.00"
    - section_number: "XX"
    - chapter_number: "95"
    - classification_confidence: 99.9
    - validation_status: "validated"

